name: "Auto-merge"

# pull_request_target: the job gets this repository's secrets for a fork's pull request too.
# Safe here: nothing of the pull request is checked out or run.
on:
  pull_request_target:
    types: ["opened", "reopened", "synchronize"]

permissions: {}

jobs:
  enable:
    uses: "ashdam/ffxiv-language-pack-ci/.github/workflows/auto-merge.yml@main"
    permissions:
      contents: "write"
      pull-requests: "write"
    secrets: "inherit"
