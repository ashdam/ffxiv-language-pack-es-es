name: Validate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      rules:
        description: "Comma-separated rules. Empty uses the CI rule list."
        required: false
        type: string
        default: ""
permissions: {}
jobs:
  validate:
    uses: ashdam/ffxiv-language-pack-ci/.github/workflows/validate.yml@main
    with:
      rules: ${{ inputs.rules || '' }}
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
